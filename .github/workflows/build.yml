name: Build MLTV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android (préinstallé)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MLTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Préparer le fichier APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MLTV.apk

      - name: Publier la release (lien fixe, sans coupure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "MLTV — dernière version" --notes "APK du dernier build (lien stable)."
          gh release upload latest MLTV.apk --clobber

      - name: Préparer le site (fichier direct)
        run: |
          mkdir -p site
          cp app/build/outputs/apk/debug/app-debug.apk site/MLTV.apk
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>MLTV</title><body style="font-family:sans-serif;background:#0e1116;color:#e6edf3;text-align:center;padding:40px"><h1>ML<span style="color:#ff7a18">TV</span></h1><p><a style="color:#ff7a18;font-size:20px" href="MLTV.apk">Télécharger MLTV.apk</a></p></body>' > site/index.html

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
