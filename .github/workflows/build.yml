name: Build MLTV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Préparer le SDK Android (préinstallé)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Compiler l'APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MLTV-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Préparer le fichier APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MLTV.apk

      - name: Publier la release (lien fixe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MLTV.apk \
            --title "MLTV — dernière version" \
            --notes "APK du dernier build. Installe via Downloader avec le lien raccourci."
